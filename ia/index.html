<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laurent Bourdoiseau — Création IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{ --ink:#1A1A1A; --paper:#FFFFFF; }
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif; }
    header{
      position:fixed; top:0; left:0; right:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center;
      padding:1.5rem 2rem; font-size:0.7rem; letter-spacing:0.15em; text-transform:uppercase;
      background:linear-gradient(to bottom, rgba(255,255,255,0.95), transparent);
    }
    header a{ color:var(--ink); text-decoration:none; opacity:0.5; }
    header a:hover{ opacity:1; }
    .grid{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:2px;
      padding-top:5rem;
    }
    .cell{
      aspect-ratio:1/1;
      display:flex; align-items:center; justify-content:center;
      background:#F4F4F2;
    }
    .placeholder{
      font-family:'Fraunces', serif; font-weight:300; font-style:italic;
      opacity:0.25; font-size:0.85rem; text-align:center; padding:1rem;
    }
    @media (max-width:720px){ .grid{ grid-template-columns:repeat(2, 1fr); } }
  </style>
</head>
<body>

  <header>
    <a href="../">← Laurent Bourdoiseau</a>
    <span>Création IA</span>
  </header>

  <main class="grid">
    <!-- placeholders — à remplir plus tard -->
    <div class="cell"><p class="placeholder">01</p></div>
    <div class="cell"><p class="placeholder">02</p></div>
    <div class="cell"><p class="placeholder">03</p></div>
    <div class="cell"><p class="placeholder">04</p></div>
    <div class="cell"><p class="placeholder">05</p></div>
    <div class="cell"><p class="placeholder">06</p></div>
    <div class="cell"><p class="placeholder">07</p></div>
    <div class="cell"><p class="placeholder">08</p></div>
  </main>

</body>
</html>
