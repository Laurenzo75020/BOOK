<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laurent Bourdoiseau — Photographie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{ --ink:#111; --paper:#fff; --gap:10px; }
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif; }

    header{
      padding:1.25rem 1.25rem 1rem;
      font-size:0.65rem;
      letter-spacing:0.14em;
      text-transform:uppercase;
    }
    header a{ color:var(--ink); text-decoration:none; margin-right:1.25rem; }
    header a:hover{ opacity:0.45; }
    header span{ opacity:0.9; }

    .gallery{
      display:grid;
      grid-template-columns:repeat(12, 1fr);
      gap:var(--gap);
      padding:0 1.25rem 3rem;
    }

    .cell{ line-height:0; }
    .cell img{ width:100%; height:auto; display:block; }
    .cell--p{ grid-column:span 4; }
    .cell--l{ grid-column:span 6; }

    @media (max-width:900px){
      .cell--p{ grid-column:span 6; }
      .cell--l{ grid-column:span 12; }
    }

    @media (max-width:560px){
      .gallery{ grid-template-columns:1fr; padding:0 0.75rem 2rem; }
      .cell--p, .cell--l{ grid-column:span 1; }
      header{ padding:1rem 0.75rem 0.75rem; font-size:0.6rem; }
    }
  </style>
</head>
<body>

  <header>
    <a href="../">Laurent Bourdoiseau</a>
    <span>Photographie</span>
  </header>

  <main class="gallery" aria-label="Galerie photographie">
    <figure class="cell cell--p"><img src="images/01.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--p"><img src="images/02.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--p"><img src="images/03.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--p"><img src="images/04.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--p"><img src="images/05.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--p"><img src="images/06.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--p"><img src="images/07.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--p"><img src="images/08.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--l"><img src="images/09.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--p"><img src="images/10.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--l"><img src="images/11.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--p"><img src="images/12.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--l"><img src="images/13.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--p"><img src="images/14.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--p"><img src="images/15.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--p"><img src="images/16.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--p"><img src="images/17.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--p"><img src="images/18.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--p"><img src="images/19.jpg" alt="" loading="lazy"></figure>
    <figure class="cell cell--p"><img src="images/20.jpg" alt="" loading="lazy"></figure>
  </main>

</body>
</html>
