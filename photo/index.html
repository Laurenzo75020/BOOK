<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laurent Bourdoiseau — Photographie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{ --ink:#1A1A1A; --paper:#FFFFFF; --gap:14px; }
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif; }

    header{
      padding:1.35rem 1.75rem 1.1rem;
      font-size:0.68rem; letter-spacing:0.16em; text-transform:uppercase;
    }
    header a{
      color:var(--ink); text-decoration:none;
    }
    header a:hover{ opacity:0.55; }
    header .sep{
      display:inline-block;
      margin:0 1.1rem;
      opacity:0.35;
    }

    .gallery{
      column-count:3;
      column-gap:var(--gap);
      padding:0 1.75rem 2.5rem;
    }

    .cell{
      break-inside:avoid;
      margin-bottom:var(--gap);
      line-height:0;
    }

    .cell img{
      width:100%;
      height:auto;
      display:block;
    }

    @media (max-width:980px){

    @media (max-width:560px){
      .gallery{ column-count:1; padding:0 1rem 2rem; }
      header{ padding:1.1rem 1rem 0.9rem; font-size:0.62rem; }
      header .sep{ margin:0 0.75rem; }
    }
  </style>
</head>
<body>

  <header>
    <a href="../">Laurent Bourdoiseau</a>
    <span class="sep">·</span>
    <span>Photographie</span>
  </header>

  <main class="gallery" aria-label="Galerie photographie">
    <figure class="cell"><img src="images/01.jpg" alt="" loading="lazy"></figure>
    <figure class="cell"><img src="images/02.jpg" alt="" loading="lazy"></figure>
    <figure class="cell"><img src="images/03.jpg" alt="" loading="lazy"></figure>
    <figure class="cell"><img src="images/04.jpg" alt="" loading="lazy"></figure>
    <figure class="cell"><img src="images/05.jpg" alt="" loading="lazy"></figure>
    <figure class="cell"><img src="images/06.jpg" alt="" loading="lazy"></figure>
    <figure class="cell"><img src="images/07.jpg" alt="" loading="lazy"></figure>
    <figure class="cell"><img src="images/08.jpg" alt="" loading="lazy"></figure>
    <figure class="cell"><img src="images/09.jpg" alt="" loading="lazy"></figure>
    <figure class="cell"><img src="images/10.jpg" alt="" loading="lazy"></figure>
    <figure class="cell"><img src="images/11.jpg" alt="" loading="lazy"></figure>
    <figure class="cell"><img src="images/12.jpg" alt="" loading="lazy"></figure>
  </main>

</body>
</html>
